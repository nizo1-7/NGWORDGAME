<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NGワードゲーム</title>
  <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Kosugi Maru', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #e0e0dc, #c2c2b0);
      text-align: center;
      flex-direction: column;
    }

    .game-container {
      background-color: #fff;
      padding: 40px 60px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      border: 4px solid #b0a890;
      width: 85%;
      max-width: 700px;
      animation: popIn 0.6s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      color: #333;
      font-size: 2.4rem;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .ng-word-area, .score-area {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .ng-word-display {
      font-size: 4rem;
      font-weight: bold;
      color: #d9534f;
      margin-top: 10px;
      text-transform: uppercase;
    }

    .score-counter {
      font-size: 4rem;
      font-weight: bold;
      color: #5cb85c;
      margin-top: 10px;
    }

    .game-buttons {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .game-buttons button {
      padding: 18px 40px;
      font-size: 1.6rem;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      outline: none;
    }

    #plusButton {
      background-color: #5cb85c;
      color: white;
    }

    #minusButton {
      background-color: #f0ad4e;
      color: white;
    }

    #updateNgWordButton {
      background-color: #0275d8;
      color: white;
    }

    .game-buttons button:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    .genre-select {
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    select {
      padding: 10px;
      font-size: 1.2rem;
      border-radius: 8px;
      border: 2px solid #b0a890;
    }

    @media (max-width: 768px) {
      .game-container {
        padding: 30px 20px;
      }
      h1 {
        font-size: 2rem;
      }
      .ng-word-display, .score-counter {
        font-size: 3rem;
      }
      .game-buttons button {
        padding: 15px 30px;
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>NGワードゲーム</h1>

    <div class="genre-select">
      ジャンルを選ぶ：
      <select id="genreSelector">
        <option value="all">すべて</option>
        <option value="food">食べ物</option>
        <option value="animal">動物</option>
        <option value="nature">自然</option>
        <option value="daily">日常</option>
        <option value="emotion">感情</option>
      </select>
    </div>

    <div class="ng-word-area">
      現在のNGワード: <span id="ngWordDisplay" class="ng-word-display">---</span>
    </div>

    <div class="score-area">
      ポイント: <span id="scoreCounter" class="score-counter">0</span>
    </div>

    <div class="game-buttons">
      <button id="plusButton">+</button>
      <button id="minusButton">-</button>
      <button id="updateNgWordButton">NGワードを更新</button>
    </div>
  </div>

  <script>
    const ngWords = {
      food: [
        "りんご", "バナナ", "みかん", "レモン", "いちご", "メロン", "ぶどう", "もち", "ラーメン", "カレー",
        "すし", "てんぷら", "うどん", "そば", "ハンバーガー", "ピザ", "チョコレート", "アイス", "パン", "おにぎり"
      ],
      animal: [
        "ねこ", "いぬ", "ぞう", "きりん", "くま", "うさぎ", "ぱんだ", "とり", "ライオン", "トラ",
        "さる", "ペンギン", "イルカ", "かめ", "へび", "カンガルー", "コアラ", "ひつじ", "ぶた", "うし"
      ],
      nature: [
        "雨", "雪", "風", "雲", "虹", "空", "太陽", "月", "星", "山",
        "川", "海", "森", "花", "草", "火山", "湖", "滝", "砂漠", "岩"
      ],
      daily: [
        "学校", "仕事", "電車", "車", "飛行機", "電話", "時計", "財布", "本", "かばん",
        "テレビ", "冷蔵庫", "ベッド", "机", "椅子", "靴", "服", "歯ブラシ", "鍵", "カーテン"
      ],
      emotion: [
        "うれしい", "かなしい", "こわい", "やさしい", "面白い", "つまらない", "熱い", "寒い", "強い", "弱い",
        "楽しい", "怒ってる", "びっくり", "安心", "緊張", "興奮", "疲れた", "幸せ", "不安", "満足"
      ]
    };

    // 「すべて」ジャンルを統合
    ngWords.all = [
      ...ngWords.food,
      ...ngWords.animal,
      ...ngWords.nature,
      ...ngWords.daily,
      ...ngWords.emotion
    ];

    let currentNgWord = '';
    let score = 0;

    const ngWordDisplay = document.getElementById('ngWordDisplay');
    const scoreCounter = document.getElementById('scoreCounter');
    const plusButton = document.getElementById('plusButton');
    const minusButton = document.getElementById('minusButton');
    const updateNgWordButton = document.getElementById('updateNgWordButton');
    const genreSelector = document.getElementById('genreSelector');

    function generateNewNgWord() {
      const genre = genreSelector.value;
      const words = ngWords[genre];
      if (!words || words.length === 0) {
        ngWordDisplay.textContent = "---";
        return;
      }
      const randomIndex = Math.floor(Math.random() * words.length);
      currentNgWord = words[randomIndex];
      ngWordDisplay.textContent = currentNgWord;
    }

    generateNewNgWord();

    plusButton.addEventListener('click', () => {
      score++;
      scoreCounter.textContent = score;
    });

    minusButton.addEventListener('click', () => {
      score--;
      scoreCounter.textContent = score;
    });

    updateNgWordButton.addEventListener('click', () => {
      generateNewNgWord();
    });

    genreSelector.addEventListener('change', () => {
      generateNewNgWord();
    });
  </script>
</body>
</html>
